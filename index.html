<!DOCTYPE html>
<html lang="fr">
<head>
 
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Remontée de Cave</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a66ff">
 <script src="https://cdn.jsdelivr.net/npm/xlsxll.min.jsscript.min.js>
<style>

body{
font-family:Segoe UI,sans-serif;
margin:0;
background:#f5f6f8;
}

header{
background:#0a66ff;
color:white;
padding:15px;
text-align:center;
}

.tabs{
display:flex;
flex-wrap:wrap;
gap:5px;
padding:10px;
background:white;
}

.tab{
padding:12px;
border:none;
border-radius:8px;
cursor:pointer;
background:#ddd;
}

.tab.active{
background:#0a66ff;
color:white;
}

.toolbar{
display:flex;
flex-wrap:wrap;
gap:10px;
padding:10px;
}

.toolbar button,
.toolbar input{
padding:10px;
border-radius:8px;
border:1px solid #ccc;
}

.cards{
padding:10px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
gap:10px;
}

.card{
background:white;
padding:15px;
border-radius:12px;
box-shadow:0 2px 6px rgba(0,0,0,0.15);
}

.article{
font-size:18px;
font-weight:bold;
}

.qty{
font-size:22px;
font-weight:bold;
color:#0a66ff;
}

.actions{
display:flex;
gap:5px;
flex-wrap:wrap;
margin-top:10px;
}

.actions button{
padding:8px;
border:none;
border-radius:8px;
cursor:pointer;
}

.plus{background:#198754;color:white;}
.minus{background:#fd7e14;color:white;}
.edit{background:#0d6efd;color:white;}
.delete{background:#dc3545;color:white;}

</style>
</head>

<body>

<header>
<h2>REMONTÉE DE CAVE</h2>
</header>

<div class="tabs">

<button class="tab active"
onclick="changeTab('devant',this)">
DEVANT BAR
</button>

<button class="tab"
onclick="changeTab('champagne',this)">
ARRIERE BAR CHAMPAGNE
</button>

<button class="tab"
onclick="changeTab('alcool',this)">
ARRIERE BAR ALCOOL
</button>

</div>

<div class="toolbar">

<input
type="text"
id="search"
placeholder="Rechercher..."
onkeyup="render()">

<button onclick="addArticle()">
➕ Ajouter
</button>

<button onclick="resetStock()">
🔄 Remise à zéro
</button>

<button onclick="exportData()">
📤 Export
</button>

<input
type="file"
id="importFile"
style="display:none"
onchange="importData(event)">

<button
onclick="document.getElementById('importFile').click()">
📥 Import
</button>

<button onclick="scanBarcode()">
📷 Scanner
</button>

</div>

<div class="cards" id="cards"></div>

<script>

let currentTab="devant";

let data=
JSON.parse(localStorage.getItem("caveData"))
||
{
devant:[],
champagne:[],
alcool:[]
};

function save(){
localStorage.setItem(
"caveData",
JSON.stringify(data)
);
}

function changeTab(tab,button){

currentTab=tab;

document
.querySelectorAll(".tab")
.forEach(t=>t.classList.remove("active"));

button.classList.add("active");

render();
}

function addArticle(){

let code=
prompt("Code article");

if(code===null) return;

let article=
prompt("Nom article");

if(!article) return;

let quantite=
parseInt(prompt("Quantité",0)) || 0;

data[currentTab].push({
code,
article,
quantite
});

save();
render();
}

function editArticle(index){

let item=data[currentTab][index];

item.code=
prompt("Code",item.code);

item.article=
prompt("Article",item.article);

item.quantite=
parseInt(
prompt(
"Quantité",
item.quantite
)) || 0;

save();
render();
}

function deleteArticle(index){

if(!confirm("Supprimer ?"))
return;

data[currentTab].splice(index,1);

save();
render();
}

function updateQty(index,val){

data[currentTab][index].quantite=
Math.max(
0,
data[currentTab][index].quantite+val
);

save();
render();
}

function resetStock(){

if(
confirm(
"Mettre toutes les quantités à zéro ?"
)
){

Object.keys(data)
.forEach(cat=>{

data[cat]
.forEach(item=>{

item.quantite=0;

});

});

save();
render();
}
}

function render(){

let search=
document
.getElementById("search")
.value
.toLowerCase();

let html="";

data[currentTab]
.filter(a=>
a.article
.toLowerCase()
.includes(search)
)
.forEach((item,index)=>{

html+=`

<div class="card">

<div class="article">
${item.article}
</div>

<div>
Code : ${item.code}
</div>

<div class="qty">
${item.quantite}
</div>

<div class="actions">

<button
class="minus"
onclick="updateQty(${index},-1)">
-1
</button>

<button
class="plus"
onclick="updateQty(${index},1)">
+1
</button>

<button
class="edit"
onclick="editArticle(${index})">
Modifier
</button>

<button
class="delete"
onclick="deleteArticle(${index})">
Supprimer
</button>

</div>

</div>
`;
});

document.getElementById("cards")
.innerHTML=html;
}

function exportData(){

const wb = XLSX.utils.book_new();

function createSheet(nomFeuille, donnees){

const lignes = donnees.map(item => ({
CODE: item.code,
ARTICLE: item.article,
QUANTITE: item.quantite
}));

const ws = XLSX.utils.json_to_sheet(lignes);

XLSX.utils.book_append_sheet(
wb,
ws,
nomFeuille
);

}

createSheet(
"DEVANT BAR",
data.devant
);

createSheet(
"ARRIERE BAR CHAMPAGNE",
data.champagne
);

createSheet(
"ARRIERE BAR ALCOOL",
data.alcool
);

const date = new Date();

const fichier =
"REMONTEE_DE_CAVE_" +
date.getFullYear() +
"-" +
String(date.getMonth()+1).padStart(2,'0') +
"-" +
String(date.getDate()).padStart(2,'0') +
".xlsx";

XLSX.writeFile(
wb,
fichier
);

}
function importData(event){

const file = event.target.files[0];

if(!file) return;

const reader = new FileReader();

reader.onload = function(e){

const workbook = XLSX.read(
e.target.result,
{ type: "array" }
);

let importedData = {
devant: [],
champagne: [],
alcool: []
};

function importerFeuille(
nomFeuille,
destination
){

const sheet =
workbook.Sheets[nomFeuille];

if(!sheet) return;

const rows =
XLSX.utils.sheet_to_json(
sheet,
{ header: 1 }
);

rows.forEach(row => {

if(
!row ||
row.length < 2
) return;

const code = row[0];
const article = row[1];

if(
!article ||
article === "ARTICLE"
) return;

if(
String(article).includes("DEVANT BAR") ||
String(article).includes("ARRIERE")
) return;

destination.push({
code: String(code || ""),
article: String(article),
quantite: 0
});

});

}

importerFeuille(
"DEVANT BAR",
importedData.devant
);

importerFeuille(
"ARRIERE BAR CHAMPAGNE",
importedData.champagne
);

importerFeuille(
"ARRIERE BAR ALCOOL",
importedData.alcool
);

data = importedData;

save();

render();

alert(
"Import Excel terminé !"
);

};

reader.readAsArrayBuffer(file);

}



function scanBarcode(){

alert(
"Scanner code-barres à ajouter dans la prochaine version."
);

}

render();

if('serviceWorker' in navigator){
navigator
.serviceWorker
.register('service-worker.js');
}

</script>

</body>
</html>
