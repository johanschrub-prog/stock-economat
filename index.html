<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Remontée de Cave</title>

<meta name="theme-color" content="#0a66ff">
<link rel="manifest" href="manifest.json">

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

body{
font-family:Segoe UI,sans-serif;
margin:0;
background:#f5f6f8;
}

header{
background:#0a66ff;
color:white;
padding:15px;
text-align:center;
}

.tabs{
display:flex;
gap:5px;
flex-wrap:wrap;
padding:10px;
background:white;
}

.tab{
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
background:#ddd;
}

.tab.active{
background:#0a66ff;
color:white;
}

.toolbar{
display:flex;
gap:10px;
flex-wrap:wrap;
padding:10px;
background:white;
}

.toolbar input,
.toolbar button{
padding:10px;
border-radius:8px;
border:1px solid #ccc;
}

.cards{
padding:10px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
gap:10px;
}

.card{
background:white;
padding:15px;
border-radius:12px;
box-shadow:0 2px 6px rgba(0,0,0,.15);
}

.article{
font-weight:bold;
font-size:18px;
}

.qty{
font-size:24px;
font-weight:bold;
color:#0a66ff;
margin-top:5px;
}

.actions{
display:flex;
gap:5px;
flex-wrap:wrap;
margin-top:10px;
}

.actions button{
border:none;
padding:8px;
border-radius:8px;
cursor:pointer;
}

.plus{
background:#198754;
color:white;
}

.minus{
background:#fd7e14;
color:white;
}

.edit{
background:#0d6efd;
color:white;
}

.delete{
background:#dc3545;
color:white;
}

</style>

</head>

<body>

<header>
<h2>REMONTÉE DE CAVE</h2>
</header>

<div class="tabs">

<button class="tab active"
onclick="changeTab('devant',this)">
DEVANT BAR
</button>

<button class="tab"
onclick="changeTab('champagne',this)">
ARRIERE BAR CHAMPAGNE
</button>

<button class="tab"
onclick="changeTab('alcool',this)">
ARRIERE BAR ALCOOL
</button>

</div>

<div class="toolbar">

<input
type="text"
id="search"
placeholder="Rechercher..."
onkeyup="render()">

<button onclick="addArticle()">
➕ Ajouter
</button>

<button onclick="resetStock()">
🔄 Remise à zéro
</button>

<button onclick="exportExcel()">
📤 Export Excel
</button>

<input
type="file"
id="importFile"
style="display:none"
onchange="importExcel(event)">

<button
onclick="document.getElementById('importFile').click()">
📥 Import Excel
</button>

</div>

<div
class="cards"
id="cards">
</div>

<script src="app.js"></script>

</body>
</html>
